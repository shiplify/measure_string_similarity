name: verify_commit_signatures
# Inlined (not a call to shiplify/.github) because this repo is PUBLIC and a
# public repo cannot call a private reusable workflow. Behavior mirrors the
# shared shiplify/.github verify_commit_signatures.yml: fail a PR if any of
# its commits are not signed/verified against the author's GitHub account.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-signatures:
    name: verify-signatures
    runs-on: ubuntu-latest
    steps:
      - name: Verify every PR commit is signed and verified
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "::error::This workflow must be called on a pull_request event."
            exit 1
          fi

          all_commits="$RUNNER_TEMP/pr_commits.json"
          : > "$all_commits"
          page=1
          while :; do
            resp=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API_URL}/repos/${REPO}/pulls/${PR_NUMBER}/commits?per_page=100&page=${page}")
            n=$(echo "$resp" | jq 'length')
            echo "$resp" | jq -c '.[]' >> "$all_commits"
            if [ "$n" -lt 100 ]; then break; fi
            page=$((page + 1))
          done

          total=$(wc -l < "$all_commits" | tr -d ' ')

          unsigned=$(jq -r '
            select(.commit.verification.verified == false)
            | "\(.sha[0:9])\t\(.commit.author.name)\t\(.commit.verification.reason)\t\(.commit.message | split("\n")[0])"
          ' "$all_commits")

          if [ -n "$unsigned" ]; then
            echo "::error::One or more commits in this PR are not signed/verified. Sign them and re-push (or ask the author to). See the list below."
            echo ""
            echo "Unverified commits (sha / author / reason / subject):"
            echo "$unsigned"
            echo ""
            echo "To sign your commits, configure signing (https://docs.github.com/authentication/managing-commit-signature-verification) and rebase: git rebase --exec 'git commit --amend --no-edit -S' origin/${GITHUB_BASE_REF:-main}"
            exit 1
          fi

          echo "All ${total} commit(s) in this PR are signed and verified by GitHub."
